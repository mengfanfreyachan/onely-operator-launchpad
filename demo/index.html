<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Onely Launchpad · 4 分钟演示</title>
    <style>
      body {
        margin: 0;
        background: #211e2a;
        color: #f3f1ed;
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 24px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 2px;
        color: #d8f480;
      }
      h1 {
        font-size: 36px;
        margin: 15px 0 10px;
      }
      p {
        color: #beb7c6;
        line-height: 1.8;
      }
      .frame {
        margin-top: 25px;
        background: #393440;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid #4d4657;
        box-shadow: 0 20px 90px #0005;
      }
      video {
        display: block;
        width: 100%;
        aspect-ratio: 16/9;
        background: #18151e;
      }
      .links {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 25px 0;
      }
      a {
        display: inline-block;
        padding: 10px 15px;
        background: #dffa82;
        color: #263223;
        text-decoration: none;
        border-radius: 6px;
        font-size: 13px;
      }
      .links a:nth-child(n + 2) {
        background: #3c3647;
        color: #efebf1;
      }
      .note {
        font-size: 12px;
        color: #978b9c;
        border-top: 1px solid #45404d;
        padding-top: 15px;
      }
      ol {
        color: #bbb1c1;
        line-height: 2.4;
        font-size: 13px;
        padding-left: 20px;
      }
      @media (max-width: 600px) {
        h1 {
          font-size: 26px;
        }
        main {
          padding: 25px 15px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">ONELY OPERATOR LAUNCHPAD / DEMO</div>
      <h1>从 1,600 条假设线索，到 100 位合格运营者。</h1>
      <p>
        约 4
        分钟，中文合成旁白。演示真实操作一个可运行原型；屏幕中的人物、数据与事件均为虚构。
      </p>
      <div class="frame">
        <video
          controls
          playsinline
          preload="metadata"
          poster="../demo/screenshots/overview.png"
          src="walkthrough.mp4"
        >
          您的浏览器不支持视频播放。请使用下方下载链接。
        </video>
      </div>
      <div class="links">
        <a href="walkthrough.mp4" download>下载演示 MP4 ↓</a
        ><a href="../">试用在线原型 ↗</a
        ><a href="https://github.com/mengfanfreyachan/onely-operator-launchpad"
          >查看代码与 README ↗</a
        >
      </div>
      <div class="note">
        展示内容：业务定位、三天漏斗、来源与预筛选、重复导入、个性化触达、审核 /
        激活门槛、批量培训及待验证假设。页面未连接真实招募或消息渠道。
      </div>
    </main>
  </body>
</html>
